[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-reasongraph"
version = "0.1.0"
description = "LangChain integration for ReasonGraph: a retriever, memory and tools over a graph memory that links facts by entities and cause -> effect."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "PrimAxiom Labs B.V." }]
keywords = ["langchain", "memory", "retriever", "agents", "knowledge-graph", "reasongraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langchain-core>=0.3",
    "reasongraph[langchain]>=0.7.39",
]

[project.urls]
Homepage = "https://memory.primaxiom.ai"
Repository = "https://github.com/bgokden/reasongraph"
Documentation = "https://github.com/bgokden/reasongraph/tree/main/packages/langchain-reasongraph"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "langchain-tests>=0.3"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_reasongraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
