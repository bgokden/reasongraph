[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reasongraph"
version = "0.3.1"
description = "A graph-based reasoning library with embedding search and multi-hop traversal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Berk Gokden", email = "berkgokden@gmail.com"},
]
keywords = [
    "knowledge-graph", "reasoning", "rag", "embeddings", "nlp",
    "semantic-search", "causal-reasoning", "multi-hop", "ner", "agent",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "sentence-transformers>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/bgokden/reasongraph"
Repository = "https://github.com/bgokden/reasongraph"
Issues = "https://github.com/bgokden/reasongraph/issues"

[project.optional-dependencies]
sqlite = [
    "aiosqlite>=0.19.0",
    "sqlite-vec>=0.1.6",
]
gliner2 = [
    "gliner2>=1.2.0",
    "urllib3>=2.0.0",
    "requests>=2.28.0",
]
# Default extractor: GlinerExtractor (gliner_small-v2.5), torch inference.
gliner = [
    "gliner>=0.2.20",
]
# Fast pure-ONNX embedder + reranker (FastEmbedEmbedder / FastEmbedReranker).
fastembed = [
    "fastembed>=0.8.0",
]
# Agent-memory service (HTTP + MCP transports over MemoryService).
service = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "mcp>=1.0.0",
]
# GLiNER v1 zero-shot extractor with ONNX inference (GlinerExtractor); `onnx`
# is needed to convert the model to ONNX on first use.
gliner-onnx = [
    "gliner>=0.2.20",
    "onnx>=1.16.0",
    "onnxruntime>=1.17.0",
]
# Generic ONNX token-classification extractor (OnnxTokenClassifierExtractor).
onnx = [
    "onnxruntime>=1.17.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
    "pgvector>=0.2.0",
]
all = [
    "aiosqlite>=0.19.0",
    "sqlite-vec>=0.1.6",
    "gliner2>=1.2.0",
    "urllib3>=2.0.0",
    "requests>=2.28.0",
    "fastembed>=0.8.0",
    "onnxruntime>=1.17.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
    "pgvector>=0.2.0",
]
dev = [
    "aiosqlite>=0.19.0",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.8.0",
    "onnxruntime>=1.17.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reasongraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
