name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    # Real Postgres + pgvector so the Postgres backend tests run instead of skipping
    # (a pgvector-specific bug shipped once because they were always skipped).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      REASONGRAPH_TEST_PG_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # No uv.lock is committed (see .gitignore), so key the cache on the
          # dependency declarations instead of the default **/uv.lock glob.
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # The suite loads real transformer models (embedder, reranker, NER, GLiNER,
      # NLI). Cache the Hugging Face hub dir so they download once and are restored
      # on later runs; bump the key suffix when the set of models changes.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-py${{ matrix.python-version }}-v1
          restore-keys: |
            hf-models-${{ runner.os }}-py${{ matrix.python-version }}-
            hf-models-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -v

      - name: Postgres backend tests ran (not skipped)
        run: uv run pytest tests/test_postgres_backend.py -q -rs 2>&1 | tee /tmp/pg.txt; ! grep -q "SKIPPED" /tmp/pg.txt

  # The langchain-reasongraph distribution is a thin package over reasongraph.integrations.langchain;
  # its tests are LangChain's standard retriever tests, run against the checkout's reasongraph.
  langchain-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-py3.12-v1
          restore-keys: hf-models-${{ runner.os }}-
      - name: Install the package against this checkout
        run: |
          uv venv .venv-lc --python 3.12
          uv pip install --python .venv-lc/bin/python -e ".[langchain]" -e "packages/langchain-reasongraph[test]"
      - run: .venv-lc/bin/python -m pytest packages/langchain-reasongraph/tests -q

  # The JavaScript client ships to npm separately and has no build step, so its tests are
  # node's own runner plus one strict typecheck of the declarations against real usage.
  typescript-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test test/*.test.js
      - name: The published types match the published client
        run: |
          npm install --no-save typescript
          cat > tscheck.ts <<'TS'
          import { Memory, memoryTools, MemoryError, type Fact } from "./src/index.js";
          const mem = new Memory({ apiKey: "k" });
          async function main() {
            const facts: Fact[] = await mem.discover("why?", { topK: 3 });
            const trace = await mem.traceCauses(facts[0].content);
            const hop: string = trace.chain[0].cause;
            const reply = await mem.chat([{ role: "user", content: "hi" }], { maxHistoryTokens: 4000 });
            const out: string = await memoryTools(mem)[0].execute({ text: "x" });
            try { await mem.stats(); } catch (e) { if (e instanceof MemoryError) { const s: number = e.status; } }
            return [hop, reply.reply, out];
          }
          main();
          TS
          ./node_modules/.bin/tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 tscheck.ts
